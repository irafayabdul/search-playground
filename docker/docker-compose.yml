# Single-node OpenSearch for local learning. NOT a production topology:
# the security plugin is disabled, so this speaks plain HTTP with no auth.
# Bind is 127.0.0.1 only — do not expose this to a network.
services:
  opensearch:
    image: opensearchproject/opensearch:2.19.0
    container_name: opensearch-demo
    environment:
      - discovery.type=single-node
      - DISABLE_SECURITY_PLUGIN=true
      - DISABLE_INSTALL_DEMO_CONFIG=true
      - bootstrap.memory_lock=true
      # 1g heap is plenty for the ~500-doc demo corpus; raise for bigger indices.
      - OPENSEARCH_JAVA_OPTS=-Xms1g -Xmx1g
      # knn.memory.circuit_breaker guards the native HNSW graph cache.
      - knn.memory.circuit_breaker.limit=50%
    ulimits:
      memlock: { soft: -1, hard: -1 }
      nofile:  { soft: 65536, hard: 65536 }
    ports:
      - "127.0.0.1:9200:9200"
      - "127.0.0.1:9600:9600"   # performance analyzer
    volumes:
      - opensearch-data:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 40s

  dashboards:
    image: opensearchproject/opensearch-dashboards:2.19.0
    container_name: opensearch-dashboards-demo
    environment:
      - OPENSEARCH_HOSTS=["http://opensearch:9200"]
      - DISABLE_SECURITY_DASHBOARDS_PLUGIN=true
    ports:
      - "127.0.0.1:5601:5601"
    depends_on:
      opensearch:
        condition: service_healthy

volumes:
  opensearch-data:
