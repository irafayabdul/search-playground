[project]
name = "opensearch-demo"
version = "0.1.0"
description = "Hybrid search on OpenSearch: BM25 + HNSW k-NN, fused with RRF, reranked by a cross-encoder."
requires-python = ">=3.10,<3.13"
dependencies = [
    "opensearch-py>=2.6",
    "sentence-transformers>=3.0",
    "numpy>=1.26",
    "pandas>=2.2",          # notebook result tables
    "ipykernel>=6.29",
    "jupyterlab>=4.2",
]

[tool.uv]
# torch has no cp313 wheels for every platform yet; 3.11 is the safe floor.
python-preference = "only-managed"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/opensearch_demo"]
